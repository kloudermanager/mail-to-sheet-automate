<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sheet Updater</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script>
  (function(){
    var t = localStorage.getItem('su_theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<style>
  :root[data-theme='dark']{--bg:#1c2027;--panel:#242931;--panel2:#2b313a;--line:#38404b;--text:#dde2ea;--muted:#9da6b4;--accent:#7b9ce8;--accent2:#8fd3b2;--shadow:0 1px 3px rgba(0,0,0,.22);--row-hover:#2c333d;}
  :root[data-theme='light']{--bg:#f4f6fb;--panel:#ffffff;--panel2:#f0f3fa;--line:#e2e7f0;--text:#252b3a;--muted:#69738f;--accent:#3f6fe0;--accent2:#149a72;--shadow:0 1px 3px rgba(30,41,59,.08);--row-hover:#eef1f9;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',-apple-system,Segoe UI,Roboto,Arial,sans-serif;transition:background .2s,color .2s}
  header{display:flex;align-items:center;gap:10px;padding:16px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5;flex-wrap:wrap}
  header h1{font-size:19px;margin:0;font-weight:700;flex:1}
  button{background:var(--accent);color:#fff;border:none;padding:9px 15px;border-radius:10px;cursor:pointer;font-size:14px;font-weight:500;box-shadow:var(--shadow)}
  button.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
  button.reject{background:transparent;border:1px solid var(--line);color:var(--muted)}
  button.iconBtn{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;padding:0}
  button:disabled{opacity:.5;cursor:not-allowed}
  .wrap{padding:20px 22px;max-width:1300px;margin:0 auto}
  .status{color:var(--muted);font-size:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:20px;box-shadow:var(--shadow)}
  .card h2{margin:0 0 4px;font-size:16px}
  .card p{margin:0 0 14px;color:var(--muted);font-size:13.5px;line-height:1.5}
  .importRow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  input[type=text]{background:var(--bg);border:1px solid var(--line);color:var(--text);padding:10px 13px;border-radius:10px;font-size:14px;min-width:230px}
  input[type=text]:focus{outline:2px solid var(--accent);outline-offset:1px}
  input[type=file]{color:var(--muted);font-size:13.5px;max-width:260px}
  .msg{margin-top:12px;font-size:14px}
  .msg.ok{color:var(--accent2)} .msg.err{color:#e58f8f}
  .tablewrap{overflow:auto;border-radius:14px;box-shadow:var(--shadow);border:1px solid var(--line)}
  table{width:100%;border-collapse:collapse;font-size:14.5px;background:var(--panel)}
  th,td{padding:11px 13px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
  th{color:var(--muted);font-weight:600;position:sticky;top:0;background:var(--panel2);font-size:13px;text-transform:uppercase;letter-spacing:.03em}
  tr:hover td{background:var(--row-hover)}
  .empty{padding:50px 20px;text-align:center;color:var(--muted)}
  .vendor{color:var(--accent2);font-weight:500}
  .rowActions button{margin-right:6px}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect} = React;

const SunIcon = () => (
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    <circle cx="12" cy="12" r="4"/>
    <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
  </svg>
);
const MoonIcon = () => (
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
  </svg>
);

function readAsBase64(file){
  return new Promise((resolve,reject)=>{
    const r = new FileReader();
    r.onload = ()=>resolve(String(r.result).split(',')[1]);
    r.onerror = ()=>reject(new Error('Could not read the file'));
    r.readAsDataURL(file);
  });
}

function ImportCard(){
  const [tabs,setTabs] = useState([]);
  const [vendor,setVendor] = useState('');
  const [file,setFile] = useState(null);
  const [busy,setBusy] = useState(false);
  const [msg,setMsg] = useState(null);

  useEffect(()=>{ fetch('/api/tabs').then(r=>r.json()).then(j=>{ if(j.ok) setTabs(j.tabs); }).catch(()=>{}); }, []);

  async function doImport(){
    setBusy(true); setMsg(null);
    try{
      const data = await readAsBase64(file);
      const r = await fetch('/api/import', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({vendor, filename:file.name, data})});
      const j = await r.json();
      if(!j.ok) throw new Error(j.error);
      setMsg({ok:true, text:`Imported ${j.count} rows into "${vendor.trim()}".`});
      setFile(null);
      document.getElementById('fileInput').value = '';
      fetch('/api/tabs').then(r=>r.json()).then(j=>{ if(j.ok) setTabs(j.tabs); });
    }catch(e){ setMsg({ok:false, text:e.message}); }
    setBusy(false);
  }

  return (
    <div className="card">
      <h2>Manual import</h2>
      <p>Upload a CSV or Excel file (first row must be headers, with at least Country and Rate). Rows are added straight to the company's tab — a new tab is created if it doesn't exist yet.</p>
      <div className="importRow">
        <input type="text" list="tabList" value={vendor} onChange={e=>setVendor(e.target.value)} placeholder="Company / tab name" />
        <datalist id="tabList">{tabs.map(t=><option key={t} value={t} />)}</datalist>
        <input id="fileInput" type="file" accept=".csv,.xlsx,.xls" onChange={e=>setFile(e.target.files[0]||null)} />
        <button onClick={doImport} disabled={busy || !file || !vendor.trim()}>{busy ? 'Importing...' : 'Import'}</button>
      </div>
      {msg && <div className={"msg "+(msg.ok?'ok':'err')}>{msg.text}</div>}
    </div>
  );
}

function AddItemCard({onAdded}){
  const [tabs,setTabs] = useState([]);
  const [form,setForm] = useState({vendor:'',country:'',mcc:'',mnc:'',rate:'',bind:'',operator:'',date:''});
  const [busy,setBusy] = useState(false);
  const [msg,setMsg] = useState(null);

  useEffect(()=>{ fetch('/api/tabs').then(r=>r.json()).then(j=>{ if(j.ok) setTabs(j.tabs); }).catch(()=>{}); }, []);
  function set(k,v){ setForm(f=>({...f,[k]:v})); }

  async function submit(){
    setBusy(true); setMsg(null);
    try{
      const r = await fetch('/api/add-item', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(form)});
      const j = await r.json();
      if(!j.ok) throw new Error(j.error);
      setMsg({ok:true, text:`Added ${form.country} to "${form.vendor.trim()}".`});
      setForm(f=>({...f, country:'',mcc:'',mnc:'',rate:'',bind:'',operator:'',date:''}));
      fetch('/api/tabs').then(r=>r.json()).then(j=>{ if(j.ok) setTabs(j.tabs); });
      onAdded && onAdded();
    }catch(e){ setMsg({ok:false, text:e.message}); }
    setBusy(false);
  }

  const canSubmit = form.vendor.trim() && form.country.trim() && String(form.rate).trim() && !busy;

  return (
    <div className="card">
      <h2>Add a single rate</h2>
      <p>Add one destination straight to a company's tab, no file needed. A new tab is created if the company doesn't exist yet.</p>
      <div className="importRow">
        <input type="text" list="tabList2" value={form.vendor} onChange={e=>set('vendor',e.target.value)} placeholder="Company / tab name" />
        <datalist id="tabList2">{tabs.map(t=><option key={t} value={t} />)}</datalist>
        <input type="text" value={form.country} onChange={e=>set('country',e.target.value)} placeholder="Country / Destination" />
        <input type="text" value={form.mcc} onChange={e=>set('mcc',e.target.value)} placeholder="MCC" style={{minWidth:90}} />
        <input type="text" value={form.mnc} onChange={e=>set('mnc',e.target.value)} placeholder="MNC" style={{minWidth:90}} />
        <input type="text" value={form.rate} onChange={e=>set('rate',e.target.value)} placeholder="Rate" style={{minWidth:110}} />
        <input type="text" value={form.bind} onChange={e=>set('bind',e.target.value)} placeholder="Bind" style={{minWidth:110}} />
        <input type="text" value={form.operator} onChange={e=>set('operator',e.target.value)} placeholder="Operator" />
        <input type="text" value={form.date} onChange={e=>set('date',e.target.value)} placeholder="Update date (blank = today)" style={{minWidth:200}} />
        <button onClick={submit} disabled={!canSubmit}>{busy ? 'Adding...' : 'Add'}</button>
      </div>
      {msg && <div className={"msg "+(msg.ok?'ok':'err')}>{msg.text}</div>}
    </div>
  );
}

function App(){
  const [pending,setPending] = useState([]);
  const [autoApply,setAutoApply] = useState(false);
  const [busyId,setBusyId] = useState(null);
  const [scanning,setScanning] = useState(false);
  const [scanError,setScanError] = useState('');
  const [theme,setTheme] = useState(()=>document.documentElement.getAttribute('data-theme')||'dark');

  function toggleTheme(){
    const next = theme==='dark' ? 'light' : 'dark';
    setTheme(next); document.documentElement.setAttribute('data-theme', next); localStorage.setItem('su_theme', next);
  }

  async function load(){
    const r = await fetch('/api/pending'); const j = await r.json();
    if(j.ok){ setPending(j.rows||[]); setAutoApply(j.autoApply); }
  }
  useEffect(()=>{ load(); const iv=setInterval(load, 5*60*1000); return ()=>clearInterval(iv); }, []);

  async function act(id, verb){
    setBusyId(id);
    try{ await fetch(`/api/pending/${id}/${verb}`, {method:'POST'}); await load(); }
    finally{ setBusyId(null); }
  }

  async function scanNow(){
    setScanning(true); setScanError('');
    try{
      const r = await fetch('/api/scan-now', {method:'POST'});
      const j = await r.json();
      if(!r.ok || !j.ok) throw new Error(j.error || `Scan failed (${r.status})`);
      await load();
    }catch(e){ setScanError(e.message || 'Inbox scan failed.'); }
    finally{ setScanning(false); }
  }

  return (
    <React.Fragment>
      <header>
        <h1>📥 Sheet Updater</h1>
        <span className="status">{autoApply ? 'Auto-apply is ON' : `${pending.length} pending`}</span>
        <button className="ghost iconBtn" onClick={toggleTheme} title={theme==='dark' ? 'Switch to light mode' : 'Switch to dark mode'}>
          {theme==='dark' ? <SunIcon /> : <MoonIcon />}
        </button>
        <button onClick={scanNow} disabled={scanning}>{scanning ? 'Scanning...' : 'Scan inbox now'}</button>
        {scanError && <span className="msg err" role="alert">{scanError}</span>}
      </header>
      <div className="wrap">
        <ImportCard />
        <AddItemCard />
        {autoApply ? (
          <div className="empty">Auto-apply is ON — detected emails update the sheet directly, nothing to review here.</div>
        ) : pending.length===0 ? (
          <div className="empty">No pending rate emails to review.</div>
        ) : (
          <div className="tablewrap">
            <table>
              <thead><tr><th>Country</th><th>MCC</th><th>MNC</th><th>Rate</th><th>Bind</th><th>Operator</th><th>Date</th><th>Vendor</th><th>Source</th><th>Actions</th></tr></thead>
              <tbody>
                {pending.map(p=>(
                  <tr key={p.id}>
                    <td>{p.country}</td><td>{p.mcc}</td><td>{p.mnc}</td><td>{p.rate}</td>
                    <td>{p.bind}</td><td>{p.operator}</td><td>{p.date}</td><td className="vendor">{p.vendor}</td>
                    <td style={{whiteSpace:'normal',maxWidth:260}}>{p.source}</td>
                    <td className="rowActions">
                      <button disabled={busyId===p.id} onClick={()=>act(p.id,'approve')}>Approve</button>
                      <button className="reject" disabled={busyId===p.id} onClick={()=>act(p.id,'reject')}>Reject</button>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </div>
    </React.Fragment>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
